<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Smart Environment Form Handler</title>
  </head>
  <body>
    <form name="get-in-touch" method="POST" data-netlify="true" netlify-honeypot="bot-field" action="/__netlify-form-handler.html">
      <input type="hidden" name="form-name" value="get-in-touch" />
      <input type="hidden" name="subject" value="New Smart Environment enquiry from %{formName} (%{submissionId})" />
      <p hidden>
        <label>Do not fill this out if you are human: <input name="bot-field" /></label>
      </p>
      <label>Full Name <input name="name" type="text" /></label>
      <label>Email <input name="email" type="email" /></label>
      <label>Phone <input name="phone" type="tel" /></label>
      <label>Message <textarea name="message"></textarea></label>
      <button type="submit">Send</button>
    </form>
  </body>
</html>
