<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1124 716" role="img" aria-labelledby="title">
  <title>Smart Environment Group logo</title>
  <defs>
    <filter id="goldify" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feColorMatrix in="SourceGraphic" type="luminanceToAlpha" result="alphaMask" />
      <feComponentTransfer in="alphaMask" result="invertedMask">
        <feFuncA type="table" tableValues="1 1 1 1 1 0" />
      </feComponentTransfer>
      <feFlood flood-color="#d4a017" result="goldFill" />
      <feComposite in="goldFill" in2="invertedMask" operator="in" />
    </filter>
  </defs>
  <image href="/branding/logo-original.png" width="1124" height="716" filter="url(#goldify)" preserveAspectRatio="xMidYMid meet" />
</svg>
